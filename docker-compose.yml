# Starts MySQL and Redis, the two things Tollbooth depends on.
# Run:   docker compose up -d
# Stop:  docker compose down
services:
  mysql:
    image: mysql:8.4
    container_name: tollbooth-mysql
    environment:
      MYSQL_DATABASE: tollbooth
      MYSQL_USER: tollbooth
      MYSQL_PASSWORD: tollbooth
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql

  # Redis Stack = Redis + vector search (needed later for the semantic cache)
  redis:
    image: redis/redis-stack-server:latest
    container_name: tollbooth-redis
    ports:
      - "6379:6379"

  # Phase 7 EXPERIMENT: open-source duplicate-question model. Measured at 46% accuracy on our pairs,
  # so it is off by default. Start it only to re-run the comparison:
  #   docker compose --profile experiments up -d --build
  duplicate-checker:
    profiles: ["experiments"]
    build: ./duplicate-checker
    container_name: tollbooth-duplicate-checker
    ports:
      - "8001:8000"

volumes:
  mysqldata:
