spring:
  application:
    name: tollbooth

  datasource:
    url: jdbc:mysql://localhost:3306/tollbooth
    username: tollbooth
    password: tollbooth

  jpa:
    hibernate:
      # Creates/updates tables from our entity classes automatically.
      # Fine for development; a real company would use migrations (Flyway).
      ddl-auto: update
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379

  jackson:
    mapper:
      # Lets clients send "regular" or "REGULAR" for enum values
      accept-case-insensitive-enums: true

# Show full health details (database + redis status) at /actuator/health
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

tollbooth:
  ai:
    base-url: https://generativelanguage.googleapis.com/v1beta
    # Read from the GEMINI_API_KEY environment variable. Never write the real key in this file.
    api-key: ${GEMINI_API_KEY:}
    # Every question uses this model until routing arrives in Phase 5
    default-model: gemini-3.5-flash-lite
    # The last two sentences tell the AI how to treat masked private data (Phase 4)
    system-prompt: >-
      You are a helpful assistant inside a consumer app.
      Answer clearly and briefly, in plain language.
      Text like [EMAIL_1], [PHONE_1] or [CARD_1] stands for the user's private details.
      Keep these placeholders exactly as written and never guess what they hide.
    connect-timeout-ms: 5000
    read-timeout-ms: 30000
  # Token bucket per user: "capacity" questions in a burst, then 1 token back every "refill-every".
  # Demo values are small so you can hit the limit by hand and stay under Gemini's free-tier limits.
  # A real app might use regular: 20 / 3s, premium: 60 / 1s.
  rate-limit:
    regular:
      capacity: 5
      refill-every: 12s
    premium:
      capacity: 10
      refill-every: 6s
  demo:
    app-name: DemoShop
    # The demo app's API key. Only its SHA-256 hash is stored in the database.
    api-key: tb_demo_key_change_me
    daily-budget-usd: 5.00
  # Paid-tier prices in USD per 1 million tokens. On the free tier you pay nothing,
  # but Tollbooth still calculates what each request WOULD cost.
  # Source: https://ai.google.dev/gemini-api/docs/pricing (checked Oct 2026).
  # gemini-3.8-flash prices double from Jan 1, 2027 (to 1.50 / 7.50).
  models:
    - name: gemini-3.5-flash-lite
      input-price-per-million: 0.30
      output-price-per-million: 2.50
    - name: gemini-3.8-flash
      input-price-per-million: 0.75
      output-price-per-million: 3.75
