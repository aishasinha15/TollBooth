spring:
  application:
    name: tollbooth

  datasource:
    url: jdbc:mysql://localhost:3306/tollbooth
    username: tollbooth
    password: tollbooth

  jpa:
    hibernate:
      # Creates/updates tables from our entity classes automatically.
      # Fine for development; a real company would use migrations (Flyway).
      ddl-auto: update
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379

  jackson:
    mapper:
      # Lets clients send "regular" or "REGULAR" for enum values
      accept-case-insensitive-enums: true

# Show full health details (database + redis status) at /actuator/health
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

tollbooth:
  ai:
    base-url: https://generativelanguage.googleapis.com/v1beta
    # Read from the GEMINI_API_KEY environment variable. Never write the real key in this file.
    api-key: ${GEMINI_API_KEY:}
    # Routing (Phase 5): EASY questions -> cheap model, HARD questions -> smart model.
    # The cheap model is also the fallback if the smart one fails, and the only model once the budget runs low.
    cheap-model: gemini-3.5-flash-lite
    smart-model: gemini-3.6-flash
    # Phase 7: the longest answer the AI may give, thinking included. The budget reserves this
    # worst case before each call, so spending can never pass the hard stop (the 267% bug).
    max-output-tokens: 2048
    # Phase 7: if a model is busy (Google 500/503), wait this long and ask it once more before falling back
    retry-delay-ms: 2000
    # If a model is unavailable for this many requests in a row, skip it for open-seconds
    # and send its questions straight to the fallback (no wasted calls or retry waits).
    # Then one trial request tests it again. Current states: GET /v1/status
    circuit-breaker:
      failure-threshold: 3
      open-seconds: 60
    # The last two sentences tell the AI how to treat masked private data (Phase 4)
    system-prompt: >-
      You are a helpful assistant inside a consumer app.
      Answer clearly and briefly, in plain language.
      Text like [EMAIL_1], [PHONE_1] or [CARD_1] stands for the user's private details.
      Keep these placeholders exactly as written and never guess what they hide.
    # Semantic cache (Phase 6): turns each question into 768 numbers that capture its meaning
    embedding-model: gemini-embedding-001
    embedding-dimensions: 768
    connect-timeout-ms: 5000
    # Smart models "think" before answering; long planning answers can take 30+ seconds
    read-timeout-ms: 60000
  # Token bucket per user: "capacity" questions in a burst, then 1 token back every "refill-every".
  # Demo values are small so you can hit the limit by hand and stay under Gemini's free-tier limits.
  # A real app might use regular: 20 / 3s, premium: 60 / 1s.
  rate-limit:
    regular:
      capacity: 5
      refill-every: 12s
    premium:
      capacity: 10
      refill-every: 6s
  # Daily AI budget per app (the amount itself is set per app, e.g. demo.daily-budget-usd below).
  #   below warn-at-percent : normal
  #   warn-at-percent..100% : normal, with "budgetWarning": true in the response
  #   100%..hard-stop       : every question goes to the cheap model
  #   at hard-stop-percent  : 503, no more AI calls until midnight
  budget:
    warn-at-percent: 80
    hard-stop-percent: 120
    timezone: Asia/Kolkata
  # Answer cache (Phase 6, reworked in Phase 7). Only GENERAL questions with no private data are cached.
  #   exact cache    : same question after lower-casing and removing punctuation
  #   same meaning   : "retrieve, then verify"
  #     1. retrieve: embeddings find saved questions with similarity >= semantic-threshold (most similar first)
  #     2. verify:   a judge checks the top few: does one answer really fit both questions?
  # Why step 2: Phase 7 measured 50 labelled pairs. "3-day vs 5-day Goa trip" scored 0.975 (different answer)
  # while "Can I return shoes that don't fit?" scored 0.873 (same answer). No similarity cut-off is safe.
  cache:
    enabled: true
    ttl: 24h
    semantic-threshold: 0.88
    # 0.99 = effectively off: everything goes through the judge (measured: 0.98 was the lowest line with no wrong hits)
    auto-accept-threshold: 0.99
    max-semantic-entries: 500
    # Who checks "does one answer really fit both questions?" Measured on 50 labelled pairs (Phase 7):
    #   gemini          : YES/NO from the cheap Gemini model. Right on 38 of 39 pairs (97.4%), about $0.00004 a check
    #   duplicate-model : open-source quora-distilroberta-base in its own container. Free, but right on only 18 of 39 (46%)
    judge: gemini
    # Check EASY questions too, not only HARD ones. Measured: about 6 in 10 checks said YES, and a check costs
    # about 1/40 of a real cheap answer, so checking pays for itself.
    check-easy-questions: true
    # Only used by the duplicate model: score (0 to 1) needed to count as "same answer"
    duplicate-threshold: 0.5
    # How many of the most similar saved questions a FREE judge checks (Gemini checks only the top one)
    rerank-top-k: 3
  # Phase 7 experiment: the duplicate-question model container (only used with judge: duplicate-model)
  duplicate-checker:
    base-url: http://localhost:8001
    timeout-ms: 3000
  # Admin API (/admin/**): create apps and their API keys. The key comes ONLY from an environment variable.
  # If TOLLBOOTH_ADMIN_KEY is not set, the admin API is switched off.
  admin:
    api-key: ${TOLLBOOTH_ADMIN_KEY:}
  # Phase 7 developer tool: POST /v1/eval/cache-threshold measures the cache on labelled pairs.
  # Turn it off (false) in production: it is not meant for apps.
  eval:
    enabled: true
    # Pause between YES/NO checks, to stay under the free tier's requests-per-minute limit
    check-delay-ms: 4000
  demo:
    app-name: DemoShop
    # The demo app's API key. Only its SHA-256 hash is stored in the database.
    api-key: tb_demo_key_change_me
    # Applied to DemoShop on every start. Set it to 0.002 to watch the budget kick in after a few questions.
    daily-budget-usd: 5.00
  # Paid-tier prices in USD per 1 million tokens. On the free tier you pay nothing,
  # but Tollbooth still calculates what each request WOULD cost.
  # Source: https://ai.google.dev/gemini-api/docs/pricing (checked Oct 2026).
  # gemini-3.6-flash and gemini-3.8-flash prices double from Jan 1, 2027 (to 1.50 / 7.50).
  models:
    - name: gemini-3.5-flash-lite
      input-price-per-million: 0.30
      output-price-per-million: 2.50
    - name: gemini-3.6-flash
      input-price-per-million: 0.75
      output-price-per-million: 3.75
    - name: gemini-3.8-flash
      input-price-per-million: 0.75
      output-price-per-million: 3.75
